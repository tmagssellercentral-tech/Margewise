# Margewise public app configuration, deployed with the Shopify CLI (`shopify app deploy`).
# Margewise app in the Margewise Partner organization (Dev Dashboard app 447089344513).
client_id = "a6ae8523b9e0c5c108dd40eccc5bfaae"
name = "Margewise"
application_url = "https://app.margewise.io"
embedded = true

[build]
include_config_on_deploy = true

[access_scopes]
# Shopify-managed install: stores approve these scopes when they install; no OAuth redirect needed.
scopes = "read_orders,read_products,read_inventory,read_customers"
# read_all_orders is added once Shopify approves the request.

[auth]
redirect_urls = ["https://app.margewise.io/auth/bounce"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled", "app_subscriptions/update"]
  uri = "https://app.margewise.io/api/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://app.margewise.io/api/webhooks"

[pos]
embedded = false
